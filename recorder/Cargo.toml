[package]
name = "dm_recorder"
version = "0.1.0"
edition = "2021"
description = "Out-of-process pub/sub recorder for make record-pubsub: subscribes to the camera shm rings + the Python state ring, writes .rrd (Rerun 0.33), fully isolated from the control loop."

[[bin]]
name = "dm_recorder"
path = "src/main.rs"

[dependencies]
# Writer-only Rerun (no native viewer). Pinned to 0.33 to match the standalone
# toolchain + the .rrd->LeRobot-v3 exporter.
rerun = { version = "0.33", default-features = false, features = ["sdk"] }
memmap2 = "0.9"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
