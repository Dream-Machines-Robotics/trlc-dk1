[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4", "mujoco>=3.0.0"]
build-backend = "scikit_build_core.build"

[project]
name = "lerobot_robot_trlc_dk1"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0.1",
  "pyserial>=3.5",
  "dynamixel-sdk>=3.7.31",
  "mujoco>=3.0.0",
]

authors = [
  {name = "Jannik Grothusen", email = "jannik@robot-learning.co"},
]
maintainers = [
  {name = "Jannik Grothusen", email = "jannik@robot-learning.co"},
]

[project.optional-dependencies]
rt = []  # C++ extension is built by scikit-build-core when installed

[project.urls]
Homepage = "https://www.robot-learning.co/"
Documentation = "https://www.docs.robot-learning.co/"

[tool.scikit-build]
cmake.source-dir = "csrc"
cmake.build-type = "Release"
# Both python packages must be declared: auto-detection only picks the one
# matching the project name (lerobot_robot_trlc_dk1), so trlc_dk1_control's
# .py files were missing from the wheel - the editable finder then pinned the
# package to the .so-only site-packages dir and `trlc_dk1_control.config`
# failed to import at rollout connect (rt_impedance is the default mode).
wheel.packages = ["lerobot_robot_trlc_dk1", "trlc_dk1_control"]
